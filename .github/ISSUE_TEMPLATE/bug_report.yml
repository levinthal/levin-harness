name: Bug report / 问题反馈
description: Report a problem with Lévin™ Harness. 欢迎使用中文或英文。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese reports are welcome. Please search existing issues before submitting.
        欢迎使用中文或英文反馈，提交前请先搜索已有议题。

        Issues are public. Remove credentials, personal information, and confidential research data from all attachments. For private vulnerability details, see the [support page](https://levinthal.design/support.html).
        议题公开可见。请从附件中移除密钥、个人信息及机密研究数据。机密漏洞详情请参阅[支持页面](https://levinthal.design/support.html)。
  - type: input
    id: version
    attributes:
      label: Lévin™ Harness version / 应用版本
      description: Enter the exact version you used, not just "latest". 请填写实际使用的完整版本号。
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system and version / 操作系统与版本
      description: Include the macOS or Windows version. 请填写 macOS 或 Windows 版本号。
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Processor and architecture / 处理器与架构
      description: Include the processor and architecture. 请填写处理器型号及架构。
      placeholder: Apple M3 Pro (arm64) / Intel Core (x64)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: List the steps and note whether the problem happens every time. 请列出操作步骤，并说明是否每次都会发生。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
      description: What did you expect to happen? 您期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: What happened instead? Include the error message, if any. 实际发生了什么？如有报错，请附上错误信息。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Related setup / 相关配置
      description: Optional. Add the model provider, model, plugin version, or remote-host OS/GPU only when relevant. Never include keys or connection credentials. 选填，仅填写相关的模型供应商、模型、插件版本或远程主机系统/GPU，不要提供密钥或连接凭据。
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Optional. Attach only the sanitized excerpts or screenshots needed to explain the problem. 选填，仅提供说明问题所需的脱敏日志片段或截图。
